name: scrape

on:
  workflow_call:
    inputs:
      script:
        description: Script to run, arguments allowed, e.g. src/main.py --dry-run
        required: true
        type: string
      commit_message:
        required: true
        type: string
      add_paths:
        description: Paths to commit back to main
        required: false
        type: string
        default: data/ db/

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment: prod
    env:
      BASE_DIR: ${{ github.workspace }}
      PYTHONPATH: .

    steps:
      - name: Checkout repo content
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute ${{ inputs.script }}
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_TOKEN_STAMPAR: ${{ secrets.TELEGRAM_API_TOKEN_STAMPAR }}
        run: python ${{ inputs.script }}

      - name: Commit and push scraped data
        run: |
          git config --local user.email "mate.mrse@gmail.com"
          git config --local user.name "GitHub Action"
          git add -f ${{ inputs.add_paths }}
          git commit -m "${{ inputs.commit_message }}" || echo "No changes to commit"
          git push origin main
