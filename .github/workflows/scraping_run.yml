name: run main.py

on:
  schedule:
    # GitHub queues scheduled runs 3-5 h late, so aim early and off the hour
    # to land around 11-12 local. Retune if the observed delay changes.
    - cron: '7 5 * * *'
  workflow_dispatch:

jobs:
  scrape:
    uses: ./.github/workflows/scrape.yml
    with:
      script: src/main.py
      commit_message: 'new scraper: updated data'
    secrets: inherit
