name: run temp_scraper.py

on:
  schedule:
    # 18:05 local time in Croatia (17:05 in CET). Late enough that the air
    # feed is past its 15h reading; whatever hour it holds gets stored.
    - cron: '5 16 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment: prod
    env:
      BASE_DIR: ${{ github.workspace }}
      PYTHONPATH: .

    steps:
      - name: Checkout repo content
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute temperature scraper
        run: python src/temp_scraper.py

      - name: Commit and push updated database
        run: |
          git config --local user.email "mate.mrse@gmail.com"
          git config --local user.name "GitHub Action"
          git add -f db/
          git commit -m "temp scraper: updated data" || echo "No changes to commit"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
