name: run temp_scraper.py

on:
  schedule:
    # 18:05 local time in Croatia (17:05 in CET). GitHub can delay this by
    # hours, which is fine: tx.xml holds a whole day's maximum and each row is
    # filed under the feed's own date, so the run time does not change the data.
    - cron: '5 16 * * *'
  workflow_dispatch:

jobs:
  scrape:
    uses: ./.github/workflows/scrape.yml
    with:
      script: src/temp_scraper.py
      commit_message: 'temp scraper: updated data'
    secrets: inherit
