name: manually run scraper

on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      name:
        # Friendly description to be shown in the UI instead of 'name'
        description: 'Person to greet'
        # Default value if no value is explicitly provided
        default: 'World'
        # Input has to be provided for the workflow to run
        required: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment: prod
    env:
      BASE_DIR: ${{ github.workspace }}
    steps:

      - name: checkout repo content
        uses: actions/checkout@v7 # checkout the repository content to github runner

      - name: Print working directory
        run: pwd  # Print current working directory

      - name: Check directory structure
        run: ls -R

      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9' # install the python version needed

      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: execute py script # run main.py
        working-directory: ./
        env: 
          PYTHONPATH: .
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_TOKEN_STAMPAR: ${{ secrets.TELEGRAM_API_TOKEN_STAMPAR }}
        run: python ./src/main.py

      - name: commit and push files
        run: |
          git config --local user.email "mate.mrse@gmail.com"
          git config --local user.name "GitHub Action"
          git pull
          git add -f data/ db/
          git commit -m "updated logs" || echo "No changes to commit"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

